<style>
:root{--bg:#f6f4ef;--sf:#fff;--tx:#1f1d1a;--mu:#6b665e;--bd:#e2ddd3;--ac:#b5541c;--ac2:#fbeadd;--ok:#2f7d4f;--ko:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--sf:#222120;--tx:#efece6;--mu:#a09a90;--bd:#37352f;--ac:#e08a52;--ac2:#3a2a1f;--ok:#6cc08a;--ko:#f08a82;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171614;--sf:#222120;--tx:#efece6;--mu:#a09a90;--bd:#37352f;--ac:#e08a52;--ac2:#3a2a1f;--ok:#6cc08a;--ko:#f08a82;color-scheme:dark}

body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px 0;max-width:1000px;margin:auto}

.bar h2{font-size:17px;margin:0}

.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.s{padding:4px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.card h3{margin:0 0 4px;font-size:15px}
.mu{color:var(--mu);font-size:13px}
.kpi{font-size:22px;font-weight:600;margin-top:2px}
.ok{color:var(--ok)}.ko{color:var(--ko)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--ac2);color:var(--ac)}

.prog i{display:block;height:100%;background:var(--ac)}
.row{display:flex;gap:6px;margin-top:8px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--sf);border:1px solid var(--bd);border-radius:10px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);font-size:14px;white-space:nowrap}
th{color:var(--mu);font-weight:500}
.empty{padding:30px;text-align:center;color:var(--mu)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);width:min(440px,92vw);padding:16px}

#dlg.shim{display:none;position:fixed;inset:0;margin:auto;height:fit-content;z-index:60;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}#dlg.shim[open]{display:block}
label{display:block;font-size:13px;color:var(--mu);margin-top:10px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
select[multiple]{height:90px}
#st{font-size:12px;color:var(--mu);margin-top:6px}
.rep{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px}
.rep h2{margin:0 0 4px}.rep h3{margin:16px 0 6px;font-size:15px}
html{-webkit-text-size-adjust:100%}
input,select,textarea{font-size:16px}

#f>.row:last-child{position:sticky;bottom:-16px;background:var(--sf);margin:16px -16px -16px!important;padding:10px 16px;border-top:1px solid var(--bd)}
@media (max-width:560px){main{padding:8px 12px 40px}header{padding:12px 12px 0}.grid{grid-template-columns:1fr}.bar h2{font-size:16px}}
@media print{header,.noprint,#st{display:none!important}body{background:#fff;color:#000}.rep{border:0;padding:0}}
</style>

<body>
<header><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><div style="display:flex;align-items:center;gap:10px"><img id="lg" alt="" style="display:none;max-height:44px;max-width:90px;object-fit:contain"><div><h1 id="ttl" style="margin:0"></h1><div class="mu" id="sub"></div></div></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn s" id="inst" style="display:none" onclick="doInstall()">📲 Installer</button><button class="btn g s" onclick="editEnt()">⚙ Mon entreprise</button></div></div><div id="sync" class="mu" style="font-size:12px;margin-top:6px"></div><nav id="nav" style="margin-top:8px"></nav></header>

<div id="auth" style="display:none;position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto"><div style="max-width:380px;margin:8vh auto;padding:16px">
<h2 style="margin:0 0 6px">Connexion</h2>

</div></div>
<dialog id="dlg" role="dialog" aria-modal="true"><form id="f" method="dialog" onsubmit="return false"></form></dialog>
<script>
(function(){var d=document.getElementById("dlg");if(typeof d.showModal==="function")return;
d.classList.add("shim");
d.showModal=function(){d.setAttribute("open","");d.open=true};
d.close=function(){if(!d.hasAttribute("open"))return;d.removeAttribute("open");d.open=false;d.dispatchEvent(new Event("close"))};
d.open=false})();
var S={clients:[],equipes:[],chantiers:[],finances:[],devis:[],pointages:[],taches:[],ent:{}},rapC="",tab="dash",KEY="gestion-chantiers-v1",ref=null,tm=null;
var STAT=["Devis","En cours","En pause","Terminé"];
var CATS=["Matériaux","Main-d’œuvre","Transport","Matériel","Autre"];
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fm(n){return (Number(n)||0).toLocaleString("fr-FR")+" FCFA"}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function by(k,id){return S[k].find(function(x){return x.id===id})}
function nm(k,id){var x=by(k,id);return x?x.nom:"—"}

var SCHEMA={
clients:{t:"Client",f:[["nom","Nom","text"],["tel","Téléphone","text"],["email","E-mail","text"],["adresse","Adresse","text"]]},
equipes:{t:"Membre d’équipe",f:[["nom","Nom","text"],["role","Spécialité (ex. maçon, poseur)","text"],["tel","Téléphone","text"],["tarif","Tarif journalier (FCFA)","number"]]},
chantiers:{t:"Chantier",f:[["nom","Nom du chantier","text"],["client","Client","ref:clients"],["lieu","Lieu","text"],["statut","Statut","sel:"+STAT.join("|")],["debut","Début","date"],["fin","Fin prévue","date"],["budget","Budget (FCFA)","number"],["avanc","Avancement (%)","number"],["equipe","Équipe affectée","multi:equipes"]]},
finances:{t:"Opération",f:[["type","Type","sel:Recette|Dépense"],["date","Date","date"],["montant","Montant (FCFA)","number"],["chantier","Chantier","ref:chantiers"],["tache","Tâche (facultatif)","ref:taches"],["cat","Catégorie","sel:"+CATS.join("|")],["desc","Description","text"]]},
devis:{t:"Devis / Facture",f:[["type","Type","sel:Devis|Facture"],["numero","Numéro","text"],["date","Date","date"],["client","Client","ref:clients"],["chantier","Chantier","ref:chantiers"],["tache","Tâche (facultatif)","ref:taches"],["montant","Montant (FCFA)","number"],["statut","Statut","sel:Brouillon|Envoyé|Accepté|Payé|Refusé"],["desc","Objet","text"]]},
pointages:{t:"Pointage",f:[["date","Date","date"],["membre","Ouvrier","ref:equipes"],["chantier","Chantier","ref:chantiers"],["tache","Tâche (facultatif)","ref:taches"],["jours","Jours travaillés","number"],["note","Note","text"]]},
taches:{t:"Tâche",f:[["nom","Nom de la tâche","text"],["chantier","Chantier","ref:chantiers"],["budget","Budget alloué (FCFA)","number"],["statut","Statut","sel:À faire|En cours|Terminé"],["desc","Détails","text"]]}
};
var REQ={clients:[["nom","Nom"]],equipes:[["nom","Nom"]],chantiers:[["nom","Nom du chantier"]],taches:[["nom","Nom de la tâche"],["chantier","Chantier"]],finances:[["montant","Montant"]],devis:[["montant","Montant"]],pointages:[["membre","Ouvrier"],["jours","Jours travaillés"]]};
function tcost(tid){
  var c={fact:0,mat:0,mo:0,aut:0};
  S.devis.forEach(function(d){if(d.tache===tid&&d.type=="Facture")c.fact+=Number(d.montant)||0});
  S.finances.forEach(function(f){if(f.tache===tid&&f.type=="Dépense"){var v=Number(f.montant)||0;if(f.cat==CATS[0])c.mat+=v;else if(f.cat==CATS[1])c.mo+=v;else c.aut+=v}});
  S.pointages.forEach(function(p){if(p.tache===tid){var m=by("equipes",p.membre);c.mo+=(Number(p.jours)||0)*(m?Number(m.tarif)||0:0)}});
  c.use=c.mat+c.mo+c.aut;return c;
}
function tdep(tid){return tcost(tid).use}
function addT(cid){edit("taches");$("f").elements["chantier"].value=cid}
function mo(cid){var t=0;S.pointages.forEach(function(p){if(!cid||p.chantier===cid){var m=by("equipes",p.membre);t+=(Number(p.jours)||0)*(m?Number(m.tarif)||0:0)}});return t}
function dl(name,data,mime){
  var b=new Blob([data],{type:mime});
  var anchor=function(){var u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},5000)};
  var mobile=/iphone|ipad|ipod|android/i.test(navigator.userAgent||"");
  try{
    if(mobile&&window.File&&navigator.canShare){var f=new File([b],name,{type:mime});
      if(navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(function(e){if(e&&e.name!=="AbortError")anchor()});return}}
  }catch(e){}
  anchor();
}
function csvCell(v){v=String(v==null?"":v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCSV(kind){
  if(kind=="taches"){var rr=[["Tâche","Chantier","Statut","Budget","Coût facturé","Matériaux","Main-d’œuvre","Autres","Coût utilisé","Reste budget","Solde"]];
    S.taches.forEach(function(t){var k=tcost(t.id);rr.push([t.nom,nm("chantiers",t.chantier),t.statut,t.budget,k.fact,k.mat,k.mo,k.aut,k.use,(t.budget||0)-k.use,k.fact-k.use])});
    return dl("taches.csv","﻿"+rr.map(function(r){return r.map(csvCell).join(";")}).join("\r\n"),"text/csv")}
  var sc=SCHEMA[kind],rows=[sc.f.map(function(f){return f[1]})];
  S[kind].forEach(function(o){rows.push(sc.f.map(function(f){
    var v=o[f[0]],t=f[2];
    if(t.indexOf("ref:")==0)return nm(t.slice(4),v);
    if(t.indexOf("multi:")==0)return(v||[]).map(function(i){return nm(t.slice(6),i)}).join(", ");
    return v}))});
  dl(kind+".csv","﻿"+rows.map(function(r){return r.map(csvCell).join(";")}).join("\r\n"),"text/csv");
}

function entHead(){
  var e=S.ent||{};if(!e.nom&&!e.logo)return"";
  var l=[e.activite,e.tel,e.email,e.adresse].filter(function(x){return x}).map(esc).join(" · ");
  return"<div style='margin-bottom:12px;display:flex;align-items:center;gap:10px'>"+(e.logo?"<img src=\""+e.logo+"\" style='max-height:56px;max-width:120px'>":"")+"<div><b style='font-size:17px'>"+esc(e.nom||"")+"</b>"+(l?"<br><span class='mu'>"+l+"</span>":"")+"</div></div>";
}
function editEnt(){
  var e=S.ent||{};
  var lg=e.logo||"";
  function fl(k,lb,ph){return"<label>"+lb+"</label><input name='"+k+"' placeholder='"+ph+"' value=\""+esc(e[k]||"")+"\">"}
  $("f").innerHTML="<h3 style='margin:0'>Mon entreprise</h3><div class='mu'>Ces informations apparaissent en haut de l’application et sur les rapports.</div>"+
  fl("nom","Nom de l’entreprise","Ex. Entreprise Dupont BTP")+fl("activite","Activité ou slogan (facultatif)","Ex. Terrazzo et béton minéral")+fl("tel","Téléphone (facultatif)","")+fl("email","E-mail (facultatif)","")+fl("adresse","Adresse (facultatif)","")+
  "<label>Logo (facultatif)</label><div style='display:flex;align-items:center;gap:10px'><img id='lgp' alt='' style='max-height:56px;max-width:120px;display:"+(lg?"block":"none")+"' src=\""+lg+"\"><div><input type='file' id='lgf' accept='image/*'><button type='button' class='btn g s' id='lgx' style='margin-top:6px'>Retirer le logo</button></div></div>"+
  "<label>Sauvegarde des données</label><div class='row' style='margin-top:4px'><button type='button' class='btn g s' id='bk'>Sauvegarder (fichier)</button><button type='button' class='btn g s' id='rs'>Restaurer…</button><input type='file' id='rsf' accept='application/json,.json' style='display:none'></div>"+
  "<label>Compte en ligne</label>"+acctHtml()+
  "<div class='row' style='margin-top:16px;justify-content:flex-end'><button type='button' class='btn g' id='cx'>Annuler</button><button type='button' class='btn' id='ok'>Enregistrer</button></div>";
  $("cx").onclick=function(){$("dlg").close()};
  $("ok").onclick=function(){
    var n={};["nom","activite","tel","email","adresse"].forEach(function(k){n[k]=$("f").elements[k].value.trim()});
    n.logo=lg;S.ent=n;save();$("dlg").close();render();
  };
  $("lgx").onclick=function(){lg="";$("lgp").style.display="none";$("lgf").value=""};
  $("lgf").onchange=function(){
    var f=this.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var sc=Math.min(1,240/Math.max(im.width,im.height)),cv=document.createElement("canvas");
        cv.width=Math.max(1,Math.round(im.width*sc));cv.height=Math.max(1,Math.round(im.height*sc));
        var cx=cv.getContext("2d");cx.drawImage(im,0,0,cv.width,cv.height);
        var u=cv.toDataURL("image/png");
        if(u.length>250000){cx.globalCompositeOperation="destination-over";cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);u=cv.toDataURL("image/jpeg",0.85)}
        lg=u;$("lgp").src=u;$("lgp").style.display="block";
      };
      im.onerror=function(){alert("Image illisible. Essayez un fichier PNG ou JPG.")};
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
  $("bk").onclick=function(){dl("sauvegarde-chantiers-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(S),"application/json")};
  $("rs").onclick=function(){$("rsf").click()};
  $("rsf").onchange=function(){
    var f=this.files[0];this.value="";if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var o=JSON.parse(rd.result);
        if(!o||typeof o!=="object"||!["clients","chantiers","equipes","finances","devis","pointages","taches"].some(function(k){return Array.isArray(o[k])}))throw new Error("format");
        if(!confirm("Remplacer toutes les données actuelles par cette sauvegarde ?"))return;
        for(var k in S)S[k]=(k=="ent"?(o.ent&&typeof o.ent=="object"?o.ent:{}):(Array.isArray(o[k])?o[k]:[]));
        save();$("dlg").close();render();alert("Données restaurées.");
      }catch(e){alert("Fichier de sauvegarde invalide.")}
    };
    rd.readAsText(f);
  };
  wireAcct();
  $("dlg").showModal();
}
var dirty={},lastJ={},dbExists=false,writing=false,again=false,pendSnap=null,connected=false;
var EMPTY=function(k){return JSON.stringify(k=="ent"?{}:[])};
function setSync(m){var e=$("sync");if(e)e.textContent=m}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  for(var k in S){if(JSON.stringify(S[k])!==lastJ[k])dirty[k]=1}
  pd();
  clearTimeout(tm);
  if(ref&&connected){setSync("Synchronisation…");tm=setTimeout(flush,500)}
}
function flush(){
  if(!ref)return;
  if(writing){again=true;return}
  var keys=Object.keys(dirty);
  if(!keys.length){setSync("✓ Synchronisé avec vos autres appareils");return}
  var obj={};(dbExists?keys:Object.keys(S)).forEach(function(k){obj[k]=JSON.parse(JSON.stringify(S[k]))});
  writing=true;
  (dbExists?ref.update(obj):ref.set(obj)).then(function(){
    writing=false;dbExists=true;
    for(var k in obj){lastJ[k]=JSON.stringify(obj[k]);if(JSON.stringify(S[k])===lastJ[k])delete dirty[k]}
    pd();
    if(again||Object.keys(dirty).length){again=false;flush()}else setSync("✓ Synchronisé avec vos autres appareils");
  }).catch(function(){writing=false;setSync("⚠ Synchronisation impossible, nouvel essai…");clearTimeout(tm);tm=setTimeout(flush,5000)});
}
function applyRemote(o){
  var ch=false;
  for(var k in S){
    if(dirty[k])continue;
    var r=o[k];
    if(r===undefined){if(JSON.stringify(S[k])!==EMPTY(k)){dirty[k]=1;lastJ[k]=""}continue}
    var rj=JSON.stringify(r);lastJ[k]=rj;
    if(JSON.stringify(S[k])!==rj){if(!bakDone&&JSON.stringify(S[k])!==EMPTY(k)){try{localStorage.setItem(KEY+"-avant-sync",JSON.stringify(S))}catch(e){}bakDone=true}S[k]=JSON.parse(rj);ch=true}
  }
  if(ch){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}
  if(Object.keys(dirty).length)flush();
}
function onRemote(snap){
  if(snap.metadata&&snap.metadata.fromCache)return;
  connected=true;
  if($("dlg").open){pendSnap=snap;return}
  if(!snap.exists){
    dbExists=false;
    for(var k in S){if(JSON.stringify(S[k])!==EMPTY(k))dirty[k]=1}
  }else{dbExists=true;applyRemote(snap.data())}
  if(Object.keys(dirty).length)flush();
  else if(!writing)setSync("✓ Synchronisé avec vos autres appareils");
}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);for(var k in S)S[k]=o[k]||(k=="ent"?{}:[])}}catch(e){}}

function field(f,v){
  var k=f[0],t=f[2],h="<label>"+f[1]+"</label>",nme=' name="'+k+'"';
  if(t.indexOf("sel:")==0){return h+"<select"+nme+">"+t.slice(4).split("|").map(function(o){return"<option"+(o===v?" selected":"")+">"+o+"</option>"}).join("")+"</select>"}
  if(t.indexOf("ref:")==0){var c=t.slice(4);return h+"<select"+nme+"><option value=''>—</option>"+S[c].map(function(x){return"<option value='"+x.id+"'"+(x.id===v?" selected":"")+">"+esc((x.nom||x.numero||x.desc)+(c=="taches"?" ("+nm("chantiers",x.chantier)+")":""))+"</option>"}).join("")+"</select>"}
  if(t.indexOf("multi:")==0){var c2=t.slice(6),a=v||[];return h+"<select"+nme+" multiple>"+S[c2].map(function(x){return"<option value='"+x.id+"'"+(a.indexOf(x.id)>-1?" selected":"")+">"+esc(x.nom)+"</option>"}).join("")+"</select>"}
  return h+"<input"+nme+' type="'+t+'" value="'+esc(v)+'">';
}
function edit(kind,id){
  var sc=SCHEMA[kind],o=id?by(kind,id):{};
  if(!id&&(kind=="finances"||kind=="devis"||kind=="pointages")){o={date:new Date().toISOString().slice(0,10)};if(kind=="pointages")o.jours=1}
  $("f").innerHTML="<h3 style='margin:0'>"+(id?"Modifier":"Ajouter")+" — "+sc.t+"</h3>"+sc.f.map(function(f){return field(f,o[f[0]])}).join("")+
  "<div class='row' style='margin-top:16px;justify-content:flex-end'><button type='button' class='btn g' id='cx'>Annuler</button><button type='button' class='btn' id='ok'>Enregistrer</button></div>";
  $("cx").onclick=function(){$("dlg").close()};
  $("ok").onclick=function(){
    var el0=$("f").elements,need=REQ[kind];
    if(need){var miss=need.filter(function(n){var e=el0[n[0]];return !e||!String(e.value).trim()||(e.type=="number"&&!(Number(e.value)>0))});

function del(kind,id){
  var LINK={chantiers:{f:"chantier",in:["taches","finances","devis","pointages"]},taches:{f:"tache",in:["finances","devis","pointages"]},clients:{f:"client",in:["chantiers","devis"]},equipes:{f:"membre",in:["pointages"]}}[kind];
  var n=0;if(LINK)LINK.in.forEach(function(k){S[k].forEach(function(x){if(x[LINK.f]===id)n++})});
  var msg="Supprimer cet élément ?";
  if(n){
    if(kind=="chantiers")msg="Supprimer ce chantier ET ses "+n+" élément(s) liés (tâches, opérations, devis/factures, pointages) ? Cette action est définitive.";
    else if(kind=="taches")msg="Supprimer cette tâche ? Les "+n+" élément(s) liés seront conservés mais ne seront plus rattachés à une tâche.";
    else if(kind=="clients")msg="Supprimer ce client ? Ses "+n+" chantier(s)/devis seront conservés, sans client.";
    else msg="Supprimer ce membre ? Ses "+n+" pointage(s) seront aussi supprimés.";
  }
  if(!confirm(msg))return;
  S[kind]=S[kind].filter(function(x){return x.id!==id});
  if(kind=="chantiers"){var tids=S.taches.filter(function(t){return t.chantier===id}).map(function(t){return t.id});
    ["taches","finances","devis","pointages"].forEach(function(k){S[k]=S[k].filter(function(x){return x.chantier!==id&&tids.indexOf(x.tache)<0})})}
  else if(kind=="taches"){["finances","devis","pointages"].forEach(function(k){S[k].forEach(function(x){if(x.tache===id)x.tache=""})})}
  else if(kind=="clients"){["chantiers","devis"].forEach(function(k){S[k].forEach(function(x){if(x.client===id)x.client=""})})}
  else if(kind=="equipes"){S.pointages=S.pointages.filter(function(p){return p.membre!==id});S.chantiers.forEach(function(c){if(c.equipe)c.equipe=c.equipe.filter(function(m){return m!==id})})}
  save();render();
}
